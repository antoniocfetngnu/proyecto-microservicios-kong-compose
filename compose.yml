version: "3.8"

services:
  # Kong Gateway (unchanged)
  kong:
    image: kong:3.4
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_DNS_RESOLVER: "127.0.0.11"  # Docker's internal DNS
    dns:
      - 127.0.0.11  # Docker's internal DNS
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml
    networks:
      - kong-net
    depends_on:
      - users-service
      - posts-service
      - media-service
    logging:  
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "kong"  

  # PostgreSQL Database (unchanged)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: usersdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d usersdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kong-net
    logging:  
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "postgres-users"  

  # MongoDB for Interactions (unchanged)
  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - kong-net
    logging:  
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "mongo-interactions"  

  # MongoDB for Posts Service (unchanged)
  posts-mongo:
    image: mongo:6
    container_name: posts-mongo
    restart: unless-stopped
    volumes:
      - posts_mongo_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - kong-net
    logging:  
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "posts-mongo"  

  # PostgreSQL for Media Service (NEW)
  media-postgres:
    image: postgres:15
    container_name: media-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediosdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - media_postgres_data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:  
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "media-postgres"  

  # MinIO for Media Service (NEW)
  minio:
    image: minio/minio:latest
    container_name: media-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: 
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "minio"  

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "rabbitmq"      

  # Users Microservice (unchanged)
  users-service:
    build:
      context: ./users-api
      dockerfile: Dockerfile
    container_name: users-service
    environment:
      DATABASE_URL: "host=postgres user=myuser password=mypassword dbname=usersdb port=5432 sslmode=disable"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      PORT: "3001"
      ENVIRONMENT: "development"
    networks:
      - kong-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/users/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:  
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "users-service"  

  # Interactions Microservice (unchanged)
  interactions-service:
    build:
      context: ./interactions-service
      dockerfile: Dockerfile
    container_name: interactions-service
    environment:
      PORT: "3000"
      MONGO_URL: "mongodb://mongo:27017/devspace"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"  
      NODE_ENV: "development"
    networks:
      - kong-net
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:  # Add this dependency
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:  
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "interactions-service"

  # Posts Microservice (UPDATED)
  posts-service:
    build:
      context: ./posts-api
      dockerfile: Dockerfile
    container_name: posts-service
    restart: unless-stopped
    environment:
      PORT: "3000"
      MONGO_URI: "mongodb://posts-mongo:27017/posts-db"
      USERS_GRPC_URL: "users-service:50051" 
      MEDIA_SERVICE_URL: "http://media-service:5000"  
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      INTERACTIONS_SERVICE_URL: "http://interactions-service:3000"
    networks:
      - kong-net
    depends_on:
      posts-mongo:
        condition: service_started
      users-service:  
        condition: service_started
      media-service:  
        condition: service_healthy  
      interactions-service:  
        condition: service_healthy  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/posts/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:  
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "posts-service"  

  # Media Microservice (FIXED INDENTATION)
  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile  # Make sure this file exists with lowercase 'd'
    container_name: media-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:password@media-postgres:5432/mediosdb"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
      MINIO_BUCKET: "micro-medios"
      MINIO_EXTERNAL_URL: "http://localhost:9000"
      FLASK_ENV: "development"
    networks:
      - kong-net
    depends_on:
      media-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]  # Fixed path
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:  
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "media-service"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Logstash - Procesa y envía logs a Elasticsearch
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - "5001:5000"  # Changed from 5000 to 5001 to avoid conflict
      - "12201:12201/udp"
      - "9600:9600"
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    networks:
      - kong-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Kibana - Visualiza logs en dashboard web
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - kong-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  kong-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  posts_mongo_data:
  media_postgres_data:  # New volume for media PostgreSQL
  minio_data:  # New volume for MinIO
  elasticsearch_data: