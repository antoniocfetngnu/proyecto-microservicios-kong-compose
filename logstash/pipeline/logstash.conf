input {
  # Input GELF (usado por Docker logging driver)
  gelf {
    port => 12201
  }
}

filter {
  # Agregar timestamp
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Extraer información del tag (nombre del servicio)
  if [tag] {
    mutate {
      add_field => { "service" => "%{tag}" }
    }
  }

  # Agregar tags según el servicio
  if [tag] == "users-service" {
    mutate {
      add_tag => [ "golang", "microservice", "users" ]
    }
  } else if [tag] == "posts-service" {
    mutate {
      add_tag => [ "nodejs", "microservice", "posts" ]
    }
  } else if [tag] == "interactions-service" {
    mutate {
      add_tag => [ "nodejs", "microservice", "interactions" ]
    }
  } else if [tag] == "media-service" {
    mutate {
      add_tag => [ "python", "microservice", "media" ]
    }
  } else if [tag] == "kong" {
    mutate {
      add_tag => [ "gateway", "kong" ]
    }
  }

  # Parsear nivel de log si existe
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }

  # Intentar parsear el mensaje como JSON
  if [short_message] =~ /^\{.*\}$/ or [full_message] =~ /^\{.*\}$/ {
    json {
      source => "full_message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }

  # Limpiar campos innecesarios de GELF
  mutate {
    remove_field => [ "version", "command", "created", "image_id" ]
  }
}

output {
  # Enviar a Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
  }

  # Output a consola para debugging (opcional, comentar en producción)
  stdout {
    codec => rubydebug
  }
}