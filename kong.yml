_format_version: "3.0"

services:
  # Users Service (unchanged)
  - name: users-service
    url: http://users-service:3001
    routes:
      # Public auth routes (no JWT required)
      - name: auth-public-routes
        paths:
          - /api/auth/register
          - /api/auth/login
          - /api/auth/logout
        strip_path: false

      - name: auth-protected-routes
        paths:
          - /api/auth/me
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token

      # Protected user routes
      - name: users-routes
        paths:
          - /api/users
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token

      # Protected follower routes
      - name: followers-routes
        paths:
          - /api/followers
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token

      # Protected GraphQL route
      - name: users-graphql-route
        paths:
          - /users-graphql
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token
          - name: request-transformer
            config:
              replace:
                uri: /graphql

  # Posts Service
  - name: posts-service
    url: http://posts-service:3000
    routes:
      # ========== FEED ROUTES ==========
      # Public feed (no auth required)
      - name: feed-public-route
        paths:
          - /api/feed/public
        strip_path: false
        methods:
          - GET

      # Trending feed (no auth required)
      - name: feed-trending-route
        paths:
          - /api/feed/trending
        strip_path: false
        methods:
          - GET

      # Personalized feed (requires auth)
      - name: feed-personalized-route
        paths:
          - /api/feed/personalized
        strip_path: false
        methods:
          - GET
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token

      # Discover feed (requires auth)
      - name: feed-discover-route
        paths:
          - /api/feed/discover
        strip_path: false
        methods:
          - GET
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token

      # ========== POSTS ROUTES (FIXED ORDER) ==========
      # Health check
      - name: posts-health-route
        paths:
          - /api/posts/health
        strip_path: false
        methods:
          - GET
          - HEAD

      # CRITICAL: Unlike route MUST come BEFORE generic routes to match properly
      - name: posts-unlike-routes
        paths:
          - ~/api/posts/[^/]+/unlike$
        strip_path: false
        methods:
          - DELETE
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token
        regex_priority: 1100  # HIGHEST priority for unlike

      # Like routes (GET and POST)
      - name: posts-like-routes
        paths:
          - ~/api/posts/[^/]+/like$
        strip_path: false
        methods:
          - GET
          - POST
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token
        regex_priority: 1050  # High priority for like

      # Comment routes
      - name: posts-comment-routes
        paths:
          - ~/api/posts/[^/]+/comments$
        strip_path: false
        methods:
          - POST
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token
        regex_priority: 1000

      # Public GET for viewing all posts
      - name: posts-public-get-all
        paths:
          - /api/posts
        strip_path: false
        methods:
          - GET
        regex_priority: 900

      # Public GET for posts by author
      - name: posts-public-get-by-author
        paths:
          - ~/api/posts/author/\d+$
        strip_path: false
        methods:
          - GET
        regex_priority: 850

      # Protected routes - Create post
      - name: posts-create-route
        paths:
          - /api/posts
        strip_path: false
        methods:
          - POST
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token
        regex_priority: 800

      # Protected routes - Update/Delete specific post
      - name: posts-update-delete-routes
        paths:
          - ~/api/posts/[^/]+$
        strip_path: false
        methods:
          - PUT
          - DELETE
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token
        regex_priority: 700

      # Public GET for viewing single post by ID (LOWEST priority to avoid conflicts)
      - name: posts-public-get-by-id
        paths:
          - ~/api/posts/[^/]+$
        strip_path: false
        methods:
          - GET
        regex_priority: 600  # Lower priority so specific routes match first

      - name: posts-docs-route
        paths:
          - /posts-docs
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token
          - name: request-transformer
            config:
              replace:
                uri: /api/docs

  # Media Service (unchanged)
  - name: media-service
    url: http://media-service:5000
    routes:
      # Public media access routes (no JWT required for viewing)
      - name: media-public-routes
        paths:
          - /api/media/post/
          - /api/media/batch
        strip_path: false
        methods:
          - GET
          - POST

      # Protected media management routes (JWT required for upload/delete)
      - name: media-protected-routes
        paths:
          - /api/media/upload
          - /api/media
        strip_path: false
        methods:
          - POST
          - DELETE
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token

      - name: media-docs-route
        paths:
          - /media-docs
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token
          - name: request-transformer
            config:
              replace:
                uri: /docs

      - name: media-graphql-route
        paths:
          - /media-graphql
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              secret_is_base64: false
              claims_to_verify:
                - exp
              cookie_names:
                - auth_token
          - name: request-transformer
            config:
              replace:
                uri: /graphql

      - name: media-health-route
        paths:
          - /api/media/health
        strip_path: false
        methods:
          - GET

consumers:
  - username: jwt-issuer
    jwt_secrets:
      - key: jwt-issuer-key
        algorithm: HS256
        secret: "your-super-secret-jwt-key-change-in-production"

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:5173"
      credentials: true
      max_age: 3600